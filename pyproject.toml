[project]
name = "job-assistant"
version = "0.1.0"
description = "Week 1 skeleton for the job-assistant multi-agent system"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph==0.2.76",
  "langgraph-checkpoint-sqlite==2.0.11",
  "langchain==0.3.3",
  "langchain-openai==0.2.2",
  "fastapi==0.115.0",
  "python-multipart==0.0.9",
  "uvicorn[standard]==0.30.6",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "chromadb==0.5.5",
  "sentence-transformers==3.1.1",
  "transformers==4.45.2",
  "torch==2.4.1",
  "pypdf==5.1.0",
  "PyMuPDF==1.24.14",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.3",
  "pytest-asyncio==0.23.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# data/ 目录仅用于运行时数据和测试夹具，不是 Python 包，因此显式限制只打包 app。
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
  "core_agent_tests: 标记 Week 1-2 的核心 Agent/Graph/Schema 用例，与后续外围工程测试隔离",
]
