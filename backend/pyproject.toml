[project]
name = "career-agent-workbench-api"
version = "0.1.0"
description = "LangGraph Supervisor-Worker backend for the AI career workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.6,<1",
  "langgraph-checkpoint-sqlite>=2,<3",
  "langgraph-supervisor>=0.0.29,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
